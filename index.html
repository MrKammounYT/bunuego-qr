<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Bunuego Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#141414; --card:#232323; --text:#EDEAE3; --muted:#A3A29D; --yellow:#FFD60A; --danger:#FF8A7A; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Plus Jakarta Sans",system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 16px; gap:18px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--yellow); }
  .event { color:var(--muted); font-size:14px; text-align:center; }
  .card { background:var(--card); border-radius:24px; padding:22px; width:100%; max-width:360px;
          display:flex; flex-direction:column; align-items:center; gap:16px; }
  #qr { background:#fff; padding:16px; border-radius:16px; }
  #qr img, #qr canvas { display:block; width:260px; height:260px; }
  .code { font-weight:800; font-size:26px; letter-spacing:0.06em; font-variant-numeric:tabular-nums; }
  .tips { color:var(--muted); font-size:13px; line-height:1.6; text-align:center; max-width:340px; }
  .error { color:var(--danger); font-weight:700; text-align:center; }
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span>bunuego</div>
  <div class="event">Fri 30 Oct 2026 · L'alliance, Sfax</div>

  <div class="card" id="card">
    <div id="qr"></div>
    <div class="code" id="code"></div>
  </div>

  <p class="tips" id="tips">Show this QR at the gate. Turn your screen brightness up and bring your ID. Don't share this link: the first scan uses the ticket.</p>

<script>
  // Ticket codes: BNG-XXXX-XXXX, no 0/O/1/I
  var PATTERN = /^BNG-[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$/;
  // The code is in the # part of the link, so it is never sent to any server or written to logs
  var raw = decodeURIComponent((location.hash || "").slice(1)).trim().toUpperCase();

  if (PATTERN.test(raw)) {
    new QRCode(document.getElementById("qr"), {
      text: raw, width: 520, height: 520,
      colorDark: "#000000", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById("code").textContent = raw;
  } else {
    document.getElementById("card").innerHTML =
      '<p class="error">This ticket link isn\'t valid.</p>' +
      '<p class="tips">Check the link in your SMS, or show your ticket code at the Issues desk.</p>';
    document.getElementById("tips").style.display = "none";
  }
</script>
</body>
</html>
